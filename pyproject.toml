[project]
name = "tradebox"
version = "0.1.0"
description = "Stock option trading platform with Robinhood API integration"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "robin-stocks>=3.4.0",
    "textual>=7.0.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "flask>=3.1.2",
    "gunicorn>=20.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "textual-dev>=1.8.0",
]
